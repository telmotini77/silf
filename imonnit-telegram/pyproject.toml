[project]
name = "imonnit-telegram"
version = "0.2.0"
description = "Reenvío de IMAP a Telegram"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["app"]

dependencies = [
    "fastapi[all]>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "pydantic-settings>=2.0.0",
    "aioimaplib>=1.0.1",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "nh3>=0.2.14",
    "weasyprint>=60.0",
    "tzdata"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0"
]
